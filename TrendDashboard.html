<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<script src="https://www.gstatic.com/charts/loader.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
    margin: 0;
    padding: 16px 20px;
    color: #202124;
    font-size: 13px;
  }
  h2 {
    font-size: 15px;
    margin: 0 0 12px;
    color: #3c4043;
  }
  .filters {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
  }
  .filters label {
    font-size: 12px;
    color: #5f6368;
    margin-right: 4px;
  }
  select, .msel-btn {
    padding: 5px 8px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    font-size: 13px;
    background: #fff;
  }
  .charts {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
  }
  .chart-box {
    flex: 1;
    border: 1px solid #e8eaed;
    border-radius: 8px;
    padding: 8px;
  }
  .chart-box .chart-title {
    font-size: 12px;
    color: #5f6368;
    margin: 2px 0 4px 4px;
  }
  .chart {
    width: 100%;
    height: 200px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  thead th, tbody td {
    border: 1px solid #dadce0;
  }
  thead th {
    text-align: right;
    padding: 6px 10px;
    color: #5f6368;
    font-weight: 600;
    position: sticky;
    top: 0;
    background: #fff;
  }
  thead th:first-child { text-align: left; }
  tbody td {
    text-align: right;
    padding: 5px 10px;
  }
  tbody td:first-child { text-align: left; color: #3c4043; }
  tbody tr:hover { background: #f8f9fa; }
  .table-wrap {
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid #e8eaed;
    border-radius: 8px;
  }
  .status {
    display: inline-block;
    margin-left: 6px;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 10px;
  }
  .status-good { color: #1e8e3e; background: #e6f4ea; }
  .status-warn { color: #b06000; background: #fef7e0; }
  .status-bad { color: #c5221f; background: #fce8e6; }
  .empty { color: #80868b; padding: 12px 4px; }

  .msel {
    position: relative;
    display: inline-block;
  }
  .msel-btn {
    cursor: pointer;
    min-width: 90px;
    text-align: left;
  }
  .msel-btn:after {
    content: "▾";
    float: right;
    color: #80868b;
    margin-left: 8px;
  }
  .msel-panel {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 20;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    padding: 6px 0;
    min-width: 160px;
    max-height: 220px;
    overflow-y: auto;
  }
  .msel-item {
    display: block;
    padding: 5px 12px;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  .msel-item:hover { background: #f1f3f4; }
  .msel-item input { margin-right: 6px; }
</style>
</head>
<body>
  <h2>최종마감 추이</h2>

  <div class="filters">
    <label for="daysInput">최근 일수</label>
    <input type="number" id="daysInput" min="1" value="14" style="width:60px;">
    <label>매체</label>
    <div class="msel" id="mediaMsel"></div>
    <label>보종</label>
    <div class="msel" id="productMsel"></div>
    <label for="sortOrder">날짜정렬</label>
    <select id="sortOrder">
      <option value="desc">내림차순</option>
      <option value="asc">오름차순</option>
    </select>
  </div>

  <div class="charts">
    <div class="chart-box">
      <div class="chart-title">비용 추이</div>
      <div id="costChart" class="chart"></div>
    </div>
    <div class="chart-box">
      <div class="chart-title">DB 추이</div>
      <div id="dbChart" class="chart"></div>
    </div>
    <div class="chart-box">
      <div class="chart-title">단가(CPA) 추이</div>
      <div id="cpaChart" class="chart"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>날짜</th>
          <th>비용</th>
          <th>DB</th>
          <th>단가</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

<script>
  var DATA = <?!= dataJson ?>;

  var daysInput = document.getElementById('daysInput');
  daysInput.max = DATA.days.length;
  daysInput.value = Math.min(DATA.defaultDays || 14, DATA.days.length);

  function findMediaGroup(media) {
    for (var i = 0; i < DATA.mediaGroups.length; i++) {
      if (DATA.mediaGroups[i].media === media) return DATA.mediaGroups[i];
    }
    return null;
  }

  // 매체와 무관하게, 전체 매체를 통틀어 등장하는 보종 이름 목록(중복 제거)을 구한다.
  function collectAllProducts() {
    var seen = {};
    var list = [];
    DATA.mediaGroups.forEach(function(g) {
      g.items.forEach(function(item) {
        if (!seen[item.product]) {
          seen[item.product] = true;
          list.push(item.product);
        }
      });
    });
    return list;
  }

  function toSet(list) {
    var s = {};
    list.forEach(function(v) { s[v] = true; });
    return s;
  }

  // 체크박스로 여러 개를 고를 수 있는 작은 드롭다운. 선택이 하나도 없으면 "전체"로 취급한다.
  function createMultiSelect(container, allLabel) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'msel-btn';

    var panel = document.createElement('div');
    panel.className = 'msel-panel';
    panel.style.display = 'none';

    container.appendChild(btn);
    container.appendChild(panel);

    var selected = {};
    var onChangeCb = null;

    function updateButtonLabel() {
      var keys = Object.keys(selected);
      btn.textContent = keys.length === 0 ? allLabel : (keys.length + '개 선택');
    }

    function setOptions(values) {
      selected = {};
      panel.innerHTML = '';

      values.forEach(function(v) {
        var label = document.createElement('label');
        label.className = 'msel-item';

        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = v;
        cb.addEventListener('change', function() {
          if (cb.checked) selected[v] = true; else delete selected[v];
          updateButtonLabel();
          if (onChangeCb) onChangeCb();
        });

        label.appendChild(cb);
        label.appendChild(document.createTextNode(v));
        panel.appendChild(label);
      });

      updateButtonLabel();
    }

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });

    document.addEventListener('click', function(e) {
      if (!container.contains(e.target)) panel.style.display = 'none';
    });

    return {
      setOptions: setOptions,
      getSelected: function() { return Object.keys(selected); },
      onChange: function(cb) { onChangeCb = cb; }
    };
  }

  var mediaMultiSelect = createMultiSelect(document.getElementById('mediaMsel'), '전체');
  var productMultiSelect = createMultiSelect(document.getElementById('productMsel'), '전체');

  mediaMultiSelect.setOptions(DATA.mediaGroups.map(function(g) { return g.media; }));

  // 매체를 하나도 안 골라도(=전체) 보종만 여러 개 골라 매체 간 합산해서 볼 수 있도록,
  // 보종 목록은 매체 선택 여부와 상관없이 항상 구성한다.
  function rebuildProductOptions() {
    var selectedMedia = mediaMultiSelect.getSelected();
    var products;

    if (selectedMedia.length === 0) {
      products = collectAllProducts();
    } else {
      var seen = {};
      products = [];
      selectedMedia.forEach(function(m) {
        var group = findMediaGroup(m);
        if (!group) return;
        group.items.forEach(function(item) {
          if (!seen[item.product]) {
            seen[item.product] = true;
            products.push(item.product);
          }
        });
      });
    }

    productMultiSelect.setOptions(products);
  }

  // 입력창에 지정한 최근 일수만큼(전체 중 뒤쪽 N일) 잘라서 사용할 시작 인덱스를 구한다.
  function getVisibleStartIndex() {
    var n = parseInt(daysInput.value, 10);
    if (!n || n < 1) n = 1;
    if (n > DATA.days.length) n = DATA.days.length;
    return DATA.days.length - n;
  }

  // 선택 조건(매체/보종 각각 다중 선택 가능, 최근 일수)에 맞는 날짜별 {cost, db} 합계
  // 배열과, 매칭된 항목이 정확히 하나일 때의 targetCPA(그 외에는 null)를 계산한다.
  function computeSeries() {
    var startIdx = getVisibleStartIndex();
    var days = DATA.days.slice(startIdx);
    var totals = days.map(function() { return { cost: 0, db: 0 }; });

    var mediaSet = toSet(mediaMultiSelect.getSelected()); // 비어있으면 전체 매체
    var productSet = toSet(productMultiSelect.getSelected()); // 비어있으면 전체 보종
    var mediaFilterOn = Object.keys(mediaSet).length > 0;
    var productFilterOn = Object.keys(productSet).length > 0;

    var groups = DATA.mediaGroups.filter(function(g) {
      return !mediaFilterOn || mediaSet[g.media];
    });

    var matchedItems = [];
    groups.forEach(function(group) {
      group.items.forEach(function(item) {
        if (productFilterOn && !productSet[item.product]) return;
        matchedItems.push(item);
      });
    });

    matchedItems.forEach(function(item) {
      item.byDate.slice(startIdx).forEach(function(entry, idx) {
        if (!entry) return;
        totals[idx].cost += entry.cost;
        totals[idx].db += entry.db;
      });
    });

    var targetCPA = matchedItems.length === 1 ? matchedItems[0].targetCPA : null;

    return days.map(function(d, idx) {
      var cost = totals[idx].cost;
      var db = totals[idx].db;
      return {
        date: d,
        cost: cost,
        db: db,
        cpa: db > 0 ? Math.round(cost / db) : 0,
        hasData: cost > 0 || db > 0
      };
    }).map(function(row) { row.targetCPA = targetCPA; return row; });
  }

  // 그래프용: 필터가 전혀 걸려있지 않으면(매체/보종 모두 "전체") 지금까지처럼 하나로 합친
  // 총합 선 하나만 보여준다. 매체나 보종 중 하나라도 필터가 걸리면, 그 필터에 해당하는
  // 항목들을 합치지 않고 각각 별도의 선으로 나눠서 보여준다(보종을 골랐으면 보종별로,
  // 보종 없이 매체만 골랐으면 매체별로).
  function computeGroupedSeries() {
    var startIdx = getVisibleStartIndex();
    var days = DATA.days.slice(startIdx);

    var mediaSet = toSet(mediaMultiSelect.getSelected());
    var productSet = toSet(productMultiSelect.getSelected());
    var mediaFilterOn = Object.keys(mediaSet).length > 0;
    var productFilterOn = Object.keys(productSet).length > 0;
    var anyFilterOn = mediaFilterOn || productFilterOn;

    var groups = DATA.mediaGroups.filter(function(g) {
      return !mediaFilterOn || mediaSet[g.media];
    });

    var seriesMap = {};
    var seriesOrder = [];

    function seriesFor(label) {
      if (!seriesMap[label]) {
        seriesMap[label] = days.map(function() { return { cost: 0, db: 0 }; });
        seriesOrder.push(label);
      }
      return seriesMap[label];
    }

    groups.forEach(function(group) {
      group.items.forEach(function(item) {
        if (productFilterOn && !productSet[item.product]) return;

        // 필터가 하나도 없으면 전부 "전체"라는 하나의 시리즈로 합치고,
        // 필터가 있으면 보종 우선(보종별), 없으면 매체별로 나눈다.
        var label = !anyFilterOn ? '전체' : (productFilterOn ? item.product : group.media);
        var values = seriesFor(label);

        item.byDate.slice(startIdx).forEach(function(entry, idx) {
          if (!entry) return;
          values[idx].cost += entry.cost;
          values[idx].db += entry.db;
        });
      });
    });

    return {
      days: days,
      series: seriesOrder.map(function(label) {
        return {
          label: label,
          values: seriesMap[label].map(function(v) {
            return {
              cost: v.cost,
              db: v.db,
              cpa: v.db > 0 ? Math.round(v.cost / v.db) : 0
            };
          })
        };
      })
    };
  }

  var DOW_LABELS = ['일', '월', '화', '수', '목', '금', '토'];

  // "yyyy-MM-dd" 문자열을 지역/시간대 영향 없이 요일 인덱스(0=일 ... 6=토)로 변환한다.
  function dayOfWeekIndex(dateStr) {
    var parts = dateStr.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return d.getDay();
  }

  // 날짜 옆에 표시할 "(요일)"을 만든다. 토요일은 파란색, 일요일은 빨간색으로 강조한다.
  function dayOfWeekBadge(dateStr) {
    var idx = dayOfWeekIndex(dateStr);
    var label = DOW_LABELS[idx];
    var color = idx === 6 ? '#1a73e8' : (idx === 0 ? '#d93025' : '#5f6368');
    return '<span style="color:' + color + ';">(' + label + ')</span>';
  }

  function statusBadge(row) {
    if (row.targetCPA === null || row.targetCPA === undefined || !row.hasData) return '';
    if (row.cpa <= row.targetCPA) return '<span class="status status-good">적정</span>';
    if (row.cpa <= row.targetCPA * 1.2) return '<span class="status status-warn">주의</span>';
    return '<span class="status status-bad">초과</span>';
  }

  function renderTable(rows) {
    var body = document.getElementById('tableBody');
    body.innerHTML = '';

    rows.forEach(function(row) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + row.date + ' ' + dayOfWeekBadge(row.date) + '</td>' +
        '<td>' + (row.hasData ? row.cost.toLocaleString() : '-') + '</td>' +
        '<td>' + (row.hasData ? row.db.toLocaleString() : '-') + '</td>' +
        '<td>' + (row.hasData ? row.cpa.toLocaleString() : '-') + statusBadge(row) + '</td>';
      body.appendChild(tr);
    });
  }

  var SERIES_COLORS = ['#4285f4', '#0f9d58', '#db4437', '#f4b400', '#9c27b0', '#00acc1', '#ff7043', '#5c6bc0'];

  // 항목별(매체 또는 보종) 시리즈를 한 차트에 여러 선으로 그린다. 시리즈가 하나뿐이면
  // 범례는 굳이 안 보여준다.
  function drawCharts(grouped) {
    function buildTable(valueKey) {
      var dt = new google.visualization.DataTable();
      dt.addColumn('string', '날짜');
      grouped.series.forEach(function(s) { dt.addColumn('number', s.label); });

      grouped.days.forEach(function(d, idx) {
        var row = [d.slice(5)];
        grouped.series.forEach(function(s) { row.push(s.values[idx][valueKey]); });
        dt.addRow(row);
      });

      return dt;
    }

    var multi = grouped.series.length > 1;
    var baseOptions = {
      legend: multi ? { position: 'bottom', textStyle: { fontSize: 10 } } : { position: 'none' },
      chartArea: { left: 45, top: 10, right: 10, bottom: multi ? 55 : 30 },
      colors: SERIES_COLORS,
      pointSize: 4,
      lineWidth: 2,
      curveType: 'function' // 완만한 곡선
    };

    new google.visualization.LineChart(document.getElementById('costChart')).draw(buildTable('cost'), baseOptions);
    new google.visualization.LineChart(document.getElementById('dbChart')).draw(buildTable('db'), baseOptions);
    new google.visualization.LineChart(document.getElementById('cpaChart')).draw(buildTable('cpa'), baseOptions);
  }

  var sortOrder = document.getElementById('sortOrder');

  function refresh() {
    var rows = computeSeries(); // 표: 선택 조건 전체 합계
    if (rows.every(function(r) { return !r.hasData; })) {
      document.getElementById('tableBody').innerHTML =
        '<tr><td colspan="4" class="empty">표시할 최종마감 데이터가 없습니다.</td></tr>';
    } else {
      // 그래프는 시간 순서(과거->최근)를 그대로 쓰고, 표는 선택한 정렬 방향으로 보여준다.
      var tableRows = sortOrder.value === 'desc' ? rows.slice().reverse() : rows;
      renderTable(tableRows);
    }
    drawCharts(computeGroupedSeries()); // 그래프: 항목별로 나눠서 각각의 추이를 비교
  }

  var chartsReady = false;

  function refreshIfReady() {
    if (chartsReady) refresh();
  }

  mediaMultiSelect.onChange(function() {
    rebuildProductOptions();
    refreshIfReady();
  });
  productMultiSelect.onChange(refreshIfReady);
  daysInput.addEventListener('input', refreshIfReady);
  daysInput.addEventListener('change', refreshIfReady);
  sortOrder.addEventListener('change', refreshIfReady);

  rebuildProductOptions();
  google.charts.load('current', { packages: ['corechart'] });
  google.charts.setOnLoadCallback(function() {
    chartsReady = true;
    refresh();
  });
</script>
</body>
</html>
