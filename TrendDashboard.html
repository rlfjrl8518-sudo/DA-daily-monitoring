<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<script src="https://www.gstatic.com/charts/loader.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
    margin: 0;
    padding: 16px 20px;
    color: #202124;
    font-size: 13px;
  }
  h2 {
    font-size: 15px;
    margin: 0 0 12px;
    color: #3c4043;
  }
  .filters {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
  }
  .filters label {
    font-size: 12px;
    color: #5f6368;
    margin-right: 4px;
  }
  select, .msel-btn {
    padding: 5px 8px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    font-size: 13px;
    background: #fff;
  }
  .charts {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
  }
  .chart-box {
    flex: 1;
    border: 1px solid #e8eaed;
    border-radius: 8px;
    padding: 8px;
  }
  .chart-box .chart-title {
    font-size: 12px;
    color: #5f6368;
    margin: 2px 0 4px 4px;
  }
  .chart {
    width: 100%;
    height: 200px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  thead th, tbody td {
    border: 1px solid #dadce0;
  }
  thead th {
    text-align: right;
    padding: 6px 10px;
    color: #5f6368;
    font-weight: 600;
    position: sticky;
    top: 0;
    background: #fff;
  }
  thead th:first-child { text-align: left; }
  tbody td {
    text-align: right;
    padding: 5px 10px;
  }
  tbody td:first-child { text-align: left; color: #3c4043; }
  tbody tr:hover { background: #f8f9fa; }
  .table-wrap {
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid #e8eaed;
    border-radius: 8px;
  }
  .status {
    display: inline-block;
    margin-left: 6px;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 10px;
  }
  .status-good { color: #1e8e3e; background: #e6f4ea; }
  .status-warn { color: #b06000; background: #fef7e0; }
  .status-bad { color: #c5221f; background: #fce8e6; }
  .empty { color: #80868b; padding: 12px 4px; }

  .msel {
    position: relative;
    display: inline-block;
  }
  .msel-btn {
    cursor: pointer;
    min-width: 90px;
    max-width: 220px;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    vertical-align: middle;
  }
  .msel-btn:after {
    content: "▾";
    float: right;
    color: #80868b;
    margin-left: 8px;
  }
  .msel-panel {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 20;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    padding: 6px 0;
    min-width: 160px;
    max-height: 220px;
    overflow-y: auto;
  }
  .msel-item {
    display: block;
    padding: 5px 12px;
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  .msel-item:hover { background: #f1f3f4; }
  .msel-item input { margin-right: 6px; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .tab-btn {
    padding: 6px 14px;
    border: 1px solid #dadce0;
    border-radius: 16px;
    background: #fff;
    cursor: pointer;
    font-size: 12px;
    color: #5f6368;
  }
  .tab-btn.active {
    background: #e8f0fe;
    color: #1a73e8;
    border-color: #1a73e8;
    font-weight: 600;
  }
  .adjust-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .adjust-hint {
    color: #80868b;
    font-size: 12px;
  }
  .ai-comment {
    border-left: 3px solid #dadce0;
    padding: 2px 0 2px 8px;
    line-height: 1.4;
  }
  .comment-good { border-left-color: #1e8e3e; }
  .comment-warn { border-left-color: #b06000; }
  .comment-bad { border-left-color: #c5221f; }
  .comment-neutral { border-left-color: #80868b; color: #5f6368; }
  .subtabs {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .subtab-btn {
    padding: 4px 12px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: #f1f3f4;
    cursor: pointer;
    font-size: 12px;
    color: #5f6368;
  }
  .subtab-btn.active {
    background: #fff;
    border-color: #dadce0;
    color: #202124;
    font-weight: 600;
  }
</style>
</head>
<body>
  <h2>최종마감 추이</h2>

  <div class="filters">
    <label for="daysInput">최근 일수</label>
    <input type="number" id="daysInput" min="1" value="14" style="width:60px;">
    <label>매체</label>
    <div class="msel" id="mediaMsel"></div>
    <label>보종</label>
    <div class="msel" id="productMsel"></div>
    <label for="sortOrder">날짜정렬</label>
    <select id="sortOrder">
      <option value="desc">내림차순</option>
      <option value="asc">오름차순</option>
    </select>
  </div>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="trend">추이</button>
    <button type="button" class="tab-btn" data-tab="adjust">조정사항 분석</button>
  </div>

  <div id="tab-trend">
    <div class="charts">
      <div class="chart-box">
        <div class="chart-title">비용 추이</div>
        <div id="costChart" class="chart"></div>
      </div>
      <div class="chart-box">
        <div class="chart-title">DB 추이</div>
        <div id="dbChart" class="chart"></div>
      </div>
      <div class="chart-box">
        <div class="chart-title">단가(CPA) 추이</div>
        <div id="cpaChart" class="chart"></div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>날짜</th>
            <th>비용</th>
            <th>DB</th>
            <th>단가</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div id="tab-adjust" style="display:none;">
    <div class="subtabs">
      <button type="button" class="subtab-btn active" data-subtab="daily">일자별 추이</button>
      <button type="button" class="subtab-btn" data-subtab="intraday">시간대별 현황</button>
    </div>

    <div id="subtab-daily">
      <div class="adjust-controls">
        <label for="compareWindow">비교 일수(전/후)</label>
        <input type="number" id="compareWindow" min="1" value="3" style="width:60px;">
        <span id="adjustHint" class="adjust-hint"></span>
      </div>

      <div class="chart-box" style="margin-bottom:14px;">
        <div class="chart-title">CPA 추이 + 조정사항 마커</div>
        <div id="adjustChart" class="chart" style="height:220px;"></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>조정일시</th>
              <th>매체</th>
              <th>보종</th>
              <th>카테고리</th>
              <th>세부내용</th>
              <th>전 비용</th>
              <th>전 DB</th>
              <th>전 CPA</th>
              <th>후 비용</th>
              <th>후 DB</th>
              <th>후 CPA</th>
              <th>CPA 증감</th>
              <th style="text-align:left;">AI 코멘트</th>
            </tr>
          </thead>
          <tbody id="adjustTableBody"></tbody>
        </table>
      </div>
    </div>

    <div id="subtab-intraday" style="display:none;">
      <div class="adjust-controls">
        <label for="intradayDateSelect">조정 건 선택</label>
        <select id="intradayDateSelect" style="max-width:320px;"></select>
        <span id="intradayHint" class="adjust-hint"></span>
      </div>

      <div class="chart-box" style="margin-bottom:14px;">
        <div class="chart-title">당일 시간대별 CPA 추이</div>
        <div id="intradayChart" class="chart" style="height:220px;"></div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>시각</th>
              <th>비용</th>
              <th>DB</th>
              <th>단가</th>
              <th>조정 시점</th>
            </tr>
          </thead>
          <tbody id="intradayTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  var DATA = <?!= dataJson ?>;

  var daysInput = document.getElementById('daysInput');
  daysInput.max = DATA.days.length;
  daysInput.value = Math.min(DATA.defaultDays || 14, DATA.days.length);

  function findMediaGroup(media) {
    for (var i = 0; i < DATA.mediaGroups.length; i++) {
      if (DATA.mediaGroups[i].media === media) return DATA.mediaGroups[i];
    }
    return null;
  }

  // 매체와 무관하게, 전체 매체를 통틀어 등장하는 보종 이름 목록(중복 제거)을 구한다.
  function collectAllProducts() {
    var seen = {};
    var list = [];
    DATA.mediaGroups.forEach(function(g) {
      g.items.forEach(function(item) {
        if (!seen[item.product]) {
          seen[item.product] = true;
          list.push(item.product);
        }
      });
    });
    return list;
  }

  function toSet(list) {
    var s = {};
    list.forEach(function(v) { s[v] = true; });
    return s;
  }

  // 체크박스로 여러 개를 고를 수 있는 작은 드롭다운. 선택이 하나도 없으면 "전체"로 취급한다.
  function createMultiSelect(container, allLabel) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'msel-btn';

    var panel = document.createElement('div');
    panel.className = 'msel-panel';
    panel.style.display = 'none';

    container.appendChild(btn);
    container.appendChild(panel);

    var selected = {};
    var onChangeCb = null;

    // 선택된 항목이 없으면 "전체", 있으면 실제 이름을 보여준다(개수만 표시하면 뭘 골랐는지
    // 다시 열어봐야 알 수 있어서). 2개까지는 이름을 그대로 나열하고, 그 이상이면 앞 2개 + "외
    // N개"로 줄여서 버튼이 너무 길어지지 않게 하되, title(마우스 오버 툴팁)에는 전체 목록을
    // 넣어 잘린 나머지도 바로 확인할 수 있게 한다.
    function updateButtonLabel() {
      var keys = Object.keys(selected);

      if (keys.length === 0) {
        btn.textContent = allLabel;
        btn.title = '';
        return;
      }

      btn.title = keys.join(', ');
      btn.textContent = keys.length <= 2
        ? keys.join(', ')
        : (keys.slice(0, 2).join(', ') + ' 외 ' + (keys.length - 2) + '개');
    }

    function setOptions(values) {
      selected = {};
      panel.innerHTML = '';

      values.forEach(function(v) {
        var label = document.createElement('label');
        label.className = 'msel-item';

        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = v;
        cb.addEventListener('change', function() {
          if (cb.checked) selected[v] = true; else delete selected[v];
          updateButtonLabel();
          if (onChangeCb) onChangeCb();
        });

        label.appendChild(cb);
        label.appendChild(document.createTextNode(v));
        panel.appendChild(label);
      });

      updateButtonLabel();
    }

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });

    document.addEventListener('click', function(e) {
      if (!container.contains(e.target)) panel.style.display = 'none';
    });

    return {
      setOptions: setOptions,
      getSelected: function() { return Object.keys(selected); },
      onChange: function(cb) { onChangeCb = cb; }
    };
  }

  var mediaMultiSelect = createMultiSelect(document.getElementById('mediaMsel'), '전체');
  var productMultiSelect = createMultiSelect(document.getElementById('productMsel'), '전체');

  mediaMultiSelect.setOptions(DATA.mediaGroups.map(function(g) { return g.media; }));

  // 매체를 하나도 안 골라도(=전체) 보종만 여러 개 골라 매체 간 합산해서 볼 수 있도록,
  // 보종 목록은 매체 선택 여부와 상관없이 항상 구성한다.
  function rebuildProductOptions() {
    var selectedMedia = mediaMultiSelect.getSelected();
    var products;

    if (selectedMedia.length === 0) {
      products = collectAllProducts();
    } else {
      var seen = {};
      products = [];
      selectedMedia.forEach(function(m) {
        var group = findMediaGroup(m);
        if (!group) return;
        group.items.forEach(function(item) {
          if (!seen[item.product]) {
            seen[item.product] = true;
            products.push(item.product);
          }
        });
      });
    }

    productMultiSelect.setOptions(products);
  }

  // 입력창에 지정한 최근 일수만큼(전체 중 뒤쪽 N일) 잘라서 사용할 시작 인덱스를 구한다.
  function getVisibleStartIndex() {
    var n = parseInt(daysInput.value, 10);
    if (!n || n < 1) n = 1;
    if (n > DATA.days.length) n = DATA.days.length;
    return DATA.days.length - n;
  }

  // 현재 매체/보종 다중 선택 필터에 맞는 항목들을 {media, product, targetCPA, byDate(전체 기간)}
  // 형태로 뽑아준다. 추이 탭(computeSeries/computeGroupedSeries)과 조정사항 분석 탭이 공유한다.
  function getMatchedItems() {
    var mediaSet = toSet(mediaMultiSelect.getSelected()); // 비어있으면 전체 매체
    var productSet = toSet(productMultiSelect.getSelected()); // 비어있으면 전체 보종
    var mediaFilterOn = Object.keys(mediaSet).length > 0;
    var productFilterOn = Object.keys(productSet).length > 0;

    var groups = DATA.mediaGroups.filter(function(g) {
      return !mediaFilterOn || mediaSet[g.media];
    });

    var matchedItems = [];
    groups.forEach(function(group) {
      group.items.forEach(function(item) {
        if (productFilterOn && !productSet[item.product]) return;
        matchedItems.push({
          media: group.media,
          product: item.product,
          targetCPA: item.targetCPA,
          byDate: item.byDate
        });
      });
    });

    return matchedItems;
  }

  // 현재 매체/보종 필터에 맞는 조정사항만 골라준다(비어있으면 전체).
  function getMatchedAdjustments() {
    var mediaSet = toSet(mediaMultiSelect.getSelected());
    var productSet = toSet(productMultiSelect.getSelected());
    var mediaFilterOn = Object.keys(mediaSet).length > 0;
    var productFilterOn = Object.keys(productSet).length > 0;

    return DATA.adjustments.filter(function(a) {
      if (mediaFilterOn && !mediaSet[a.media]) return false;
      if (productFilterOn && !productSet[a.product]) return false;
      return true;
    });
  }

  // 선택 조건(매체/보종 각각 다중 선택 가능, 최근 일수)에 맞는 날짜별 {cost, db} 합계
  // 배열과, 매칭된 항목이 정확히 하나일 때의 targetCPA(그 외에는 null)를 계산한다.
  function computeSeries() {
    var startIdx = getVisibleStartIndex();
    var days = DATA.days.slice(startIdx);
    var totals = days.map(function() { return { cost: 0, db: 0 }; });

    var matchedItems = getMatchedItems();

    matchedItems.forEach(function(item) {
      item.byDate.slice(startIdx).forEach(function(entry, idx) {
        if (!entry) return;
        totals[idx].cost += entry.cost;
        totals[idx].db += entry.db;
      });
    });

    var targetCPA = matchedItems.length === 1 ? matchedItems[0].targetCPA : null;

    return days.map(function(d, idx) {
      var cost = totals[idx].cost;
      var db = totals[idx].db;
      return {
        date: d,
        cost: cost,
        db: db,
        cpa: db > 0 ? Math.round(cost / db) : 0,
        hasData: cost > 0 || db > 0
      };
    }).map(function(row) { row.targetCPA = targetCPA; return row; });
  }

  // 그래프용: 필터가 전혀 걸려있지 않으면(매체/보종 모두 "전체") 지금까지처럼 하나로 합친
  // 총합 선 하나만 보여준다. 매체나 보종 중 하나라도 필터가 걸리면, 그 필터에 해당하는
  // 항목들을 합치지 않고 각각 별도의 선으로 나눠서 보여준다(보종을 골랐으면 보종별로,
  // 보종 없이 매체만 골랐으면 매체별로).
  function computeGroupedSeries() {
    var startIdx = getVisibleStartIndex();
    var days = DATA.days.slice(startIdx);

    var mediaSet = toSet(mediaMultiSelect.getSelected());
    var productSet = toSet(productMultiSelect.getSelected());
    var mediaFilterOn = Object.keys(mediaSet).length > 0;
    var productFilterOn = Object.keys(productSet).length > 0;
    var anyFilterOn = mediaFilterOn || productFilterOn;

    var groups = DATA.mediaGroups.filter(function(g) {
      return !mediaFilterOn || mediaSet[g.media];
    });

    var seriesMap = {};
    var seriesOrder = [];

    function seriesFor(label) {
      if (!seriesMap[label]) {
        seriesMap[label] = days.map(function() { return { cost: 0, db: 0 }; });
        seriesOrder.push(label);
      }
      return seriesMap[label];
    }

    groups.forEach(function(group) {
      group.items.forEach(function(item) {
        if (productFilterOn && !productSet[item.product]) return;

        // 필터가 하나도 없으면 전부 "전체"라는 하나의 시리즈로 합치고,
        // 필터가 있으면 보종 우선(보종별), 없으면 매체별로 나눈다.
        var label = !anyFilterOn ? '전체' : (productFilterOn ? item.product : group.media);
        var values = seriesFor(label);

        item.byDate.slice(startIdx).forEach(function(entry, idx) {
          if (!entry) return;
          values[idx].cost += entry.cost;
          values[idx].db += entry.db;
        });
      });
    });

    return {
      days: days,
      series: seriesOrder.map(function(label) {
        return {
          label: label,
          values: seriesMap[label].map(function(v) {
            return {
              cost: v.cost,
              db: v.db,
              cpa: v.db > 0 ? Math.round(v.cost / v.db) : 0
            };
          })
        };
      })
    };
  }

  var DOW_LABELS = ['일', '월', '화', '수', '목', '금', '토'];

  // "yyyy-MM-dd" 문자열을 지역/시간대 영향 없이 요일 인덱스(0=일 ... 6=토)로 변환한다.
  function dayOfWeekIndex(dateStr) {
    var parts = dateStr.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    return d.getDay();
  }

  // 날짜 옆에 표시할 "(요일)"을 만든다. 토요일은 파란색, 일요일은 빨간색으로 강조한다.
  function dayOfWeekBadge(dateStr) {
    var idx = dayOfWeekIndex(dateStr);
    var label = DOW_LABELS[idx];
    var color = idx === 6 ? '#1a73e8' : (idx === 0 ? '#d93025' : '#5f6368');
    return '<span style="color:' + color + ';">(' + label + ')</span>';
  }

  function statusBadge(row) {
    if (row.targetCPA === null || row.targetCPA === undefined || !row.hasData) return '';
    if (row.cpa <= row.targetCPA) return '<span class="status status-good">적정</span>';
    if (row.cpa <= row.targetCPA * 1.2) return '<span class="status status-warn">주의</span>';
    return '<span class="status status-bad">초과</span>';
  }

  function renderTable(rows) {
    var body = document.getElementById('tableBody');
    body.innerHTML = '';

    rows.forEach(function(row) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + row.date + ' ' + dayOfWeekBadge(row.date) + '</td>' +
        '<td>' + (row.hasData ? row.cost.toLocaleString() : '-') + '</td>' +
        '<td>' + (row.hasData ? row.db.toLocaleString() : '-') + '</td>' +
        '<td>' + (row.hasData ? row.cpa.toLocaleString() : '-') + statusBadge(row) + '</td>';
      body.appendChild(tr);
    });
  }

  var SERIES_COLORS = ['#4285f4', '#0f9d58', '#db4437', '#f4b400', '#9c27b0', '#00acc1', '#ff7043', '#5c6bc0'];
  var SINGLE_SERIES_COLORS = { cost: '#4285f4', db: '#0f9d58', cpa: '#db4437' }; // 선이 하나뿐일 때 지표별 구분 색

  // 항목별(매체 또는 보종) 시리즈를 한 차트에 여러 선으로 그린다. 시리즈가 하나뿐이면
  // 범례 없이 지표(비용/DB/단가)별로 다른 색을 쓰고, 여러 개면 항목별 색으로 구분하고
  // 위쪽에 범례를 보여준다.
  function drawCharts(grouped) {
    function buildTable(valueKey) {
      var dt = new google.visualization.DataTable();
      dt.addColumn('string', '날짜');
      grouped.series.forEach(function(s) { dt.addColumn('number', s.label); });

      grouped.days.forEach(function(d, idx) {
        var row = [d.slice(5)];
        grouped.series.forEach(function(s) { row.push(s.values[idx][valueKey]); });
        dt.addRow(row);
      });

      return dt;
    }

    var multi = grouped.series.length > 1;
    var baseOptions = {
      legend: multi ? { position: 'top', textStyle: { fontSize: 10 } } : { position: 'none' },
      chartArea: { left: 45, top: multi ? 30 : 10, right: 10, bottom: 30 },
      colors: SERIES_COLORS,
      pointSize: 4,
      lineWidth: 2,
      curveType: 'function' // 완만한 곡선
    };

    function optionsFor(valueKey) {
      if (multi) return baseOptions;
      return Object.assign({}, baseOptions, { colors: [SINGLE_SERIES_COLORS[valueKey]] });
    }

    new google.visualization.LineChart(document.getElementById('costChart')).draw(buildTable('cost'), optionsFor('cost'));
    new google.visualization.LineChart(document.getElementById('dbChart')).draw(buildTable('db'), optionsFor('db'));
    new google.visualization.LineChart(document.getElementById('cpaChart')).draw(buildTable('cpa'), optionsFor('cpa'));
  }

  var sortOrder = document.getElementById('sortOrder');

  function refresh() {
    var rows = computeSeries(); // 표: 선택 조건 전체 합계
    if (rows.every(function(r) { return !r.hasData; })) {
      document.getElementById('tableBody').innerHTML =
        '<tr><td colspan="4" class="empty">표시할 최종마감 데이터가 없습니다.</td></tr>';
    } else {
      // 그래프는 시간 순서(과거->최근)를 그대로 쓰고, 표는 선택한 정렬 방향으로 보여준다.
      var tableRows = sortOrder.value === 'desc' ? rows.slice().reverse() : rows;
      renderTable(tableRows);
    }
    drawCharts(computeGroupedSeries()); // 그래프: 항목별로 나눠서 각각의 추이를 비교
  }

  // totals(DATA.days와 같은 길이의 {cost, db} 배열)에서 [fromIdx, toIdx] 구간(경계 밖은 잘라냄)을
  // 합산해 비용/DB/가중평균 CPA를 계산한다.
  function aggregateWindow(totals, fromIdx, toIdx) {
    var cost = 0, db = 0;
    for (var i = Math.max(0, fromIdx); i <= Math.min(totals.length - 1, toIdx); i++) {
      cost += totals[i].cost;
      db += totals[i].db;
    }
    return { cost: cost, db: db, cpa: db > 0 ? Math.round(cost / db) : 0 };
  }

  function fmtOrDash(n) {
    return n > 0 ? n.toLocaleString() : '-';
  }

  // 매체/보종 이름으로 (현재 필터와 무관하게) DATA.mediaGroups에서 원본 항목을 찾는다.
  // 조정사항 하나하나는 항상 자기 자신의 매체/보종 실적만 기준으로 전/후를 계산해야 하므로,
  // 필터로 여러 항목이 합쳐져 있어도 이 조회로 각 조정의 실제 항목을 되찾는다.
  function findItemByMediaProduct(media, product) {
    for (var i = 0; i < DATA.mediaGroups.length; i++) {
      if (DATA.mediaGroups[i].media !== media) continue;
      var items = DATA.mediaGroups[i].items;
      for (var j = 0; j < items.length; j++) {
        if (items[j].product === product) {
          return { media: media, product: product, targetCPA: items[j].targetCPA, byDate: items[j].byDate };
        }
      }
      return null;
    }
    return null;
  }

  function itemDailyTotals(item) {
    return item.byDate.map(function(entry) {
      return entry ? { cost: entry.cost, db: entry.db } : { cost: 0, db: 0 };
    });
  }

  function getDaySnapshots(media, product, date) {
    var byDate = DATA.daySnapshots[media + '||' + product];
    return (byDate && byDate[date]) || [];
  }

  // 그 날 스냅샷들(시간순 정렬, [최종마감]은 항상 마지막) 중 조정 시각(time) 이전의 마지막
  // 스냅샷 시각을 찾는다. 그 시각까지의 누적값이 "조정 직전까지의 당일 실적"이 된다.
  function baselineSnapshotTime(snapshots, time) {
    var found = null;
    snapshots.forEach(function(s) {
      if (s.time !== '00:00' && s.time <= time) found = s.time;
    });
    return found;
  }

  // 시간대별 현황 탭에서 마커를 붙일 위치를 찾는다. baselineSnapshotTime과 달리, 조정 시각보다
  // 이른 스냅샷이 그 날 하나도 없어도(예: 그 날 첫 당일현황 클릭이 조정보다 늦은 경우) null을
  // 반환하지 않고 그 날의 첫 스냅샷에 붙여서 최소한 대략적인 위치는 보여준다. 전/후 수치 계산
  // (splitDaySnapshots)에는 쓰지 않고 오직 화면 표시용으로만 쓴다.
  function markerSnapshotTime(snapshots, time) {
    var baseline = baselineSnapshotTime(snapshots, time);
    if (baseline) return baseline;
    return snapshots.length ? snapshots[0].time : null;
  }

  // 하루치 스냅샷을 조정 시각 기준으로 "조정 전"(baseline까지 누적)과 "조정 후"(baseline부터
  // 그 날 마지막 스냅샷까지의 증분)로 나눈다. 조정 전/후를 가를 스냅샷이 부족하면(예: 그 날
  // 당일현황을 한 번도 안 눌렀거나, 조정 이후로 아직 한 번도 안 눌렀으면) hasBefore/hasAfter가
  // false가 되어 호출 쪽에서 날짜 단위 비교로 대체하게 한다.
  function splitDaySnapshots(snapshots, time) {
    if (snapshots.length === 0) return { hasBefore: false, hasAfter: false };

    var baselineTime = baselineSnapshotTime(snapshots, time);
    var before = { cost: 0, db: 0 };
    var hasAfterSnapshot = false;

    snapshots.forEach(function(s) {
      if (s.time === baselineTime) { before.cost = s.cost; before.db = s.db; }
      if (s.time === '00:00' || s.time > time) hasAfterSnapshot = true;
    });

    if (!hasAfterSnapshot) {
      return { hasBefore: !!baselineTime, hasAfter: false, beforeCost: before.cost, beforeDb: before.db };
    }

    var last = snapshots[snapshots.length - 1]; // 정렬돼 있으므로 [최종마감]이 있으면 항상 마지막

    return {
      hasBefore: !!baselineTime,
      hasAfter: true,
      beforeCost: before.cost,
      beforeDb: before.db,
      afterCost: last.cost - before.cost,
      afterDb: last.db - before.db
    };
  }

  // 조정 건 하나에 대해 "전 = (D-N일~D-1일 합계) + (D일 조정 전)", "후 = (D일 조정 후) +
  // (D+1일~D+N일 합계)"를 계산한다. D일 안에서 조정 전/후를 가를 스냅샷이 부족하면 D일 자체를
  // 비교에서 제외(기존 방식)하고 intradayOk를 false로 표시한다.
  function computeMergedBeforeAfter(adj, windowDays) {
    var item = findItemByMediaProduct(adj.media, adj.product);
    var dIdx = item ? DATA.days.indexOf(adj.date) : -1;

    if (!item || dIdx === -1) {
      var empty = { cost: 0, db: 0, cpa: 0 };
      return { before: empty, after: Object.assign({}, empty), intradayOk: false };
    }

    var totals = itemDailyTotals(item);
    var beforeDaily = aggregateWindow(totals, dIdx - windowDays, dIdx - 1);
    var afterDaily = aggregateWindow(totals, dIdx + 1, dIdx + windowDays);

    var snaps = getDaySnapshots(adj.media, adj.product, adj.date);
    var split = splitDaySnapshots(snaps, adj.time);

    var before, after, intradayOk;

    if (split.hasBefore && split.hasAfter) {
      before = { cost: beforeDaily.cost + split.beforeCost, db: beforeDaily.db + split.beforeDb };
      after = { cost: split.afterCost + afterDaily.cost, db: split.afterDb + afterDaily.db };
      intradayOk = true;
    } else {
      before = beforeDaily;
      after = afterDaily;
      intradayOk = false;
    }

    before.cpa = before.db > 0 ? Math.round(before.cost / before.db) : 0;
    after.cpa = after.db > 0 ? Math.round(after.cost / after.db) : 0;

    return { before: before, after: after, intradayOk: intradayOk };
  }

  // 매체/보종을 각각 정확히 하나씩 선택했을 때만 CPA 추이 위에 조정사항 마커를 점으로 찍어 보여준다.
  // 여러 항목이 섞이면 어느 조정이 어느 선에 해당하는지 알 수 없어 마커를 표시하지 않는다.
  function renderAdjustChart(item, adjustments) {
    var container = document.getElementById('adjustChart');

    if (!item) {
      container.innerHTML = '';
      return;
    }

    var startIdx = getVisibleStartIndex();
    var days = DATA.days.slice(startIdx);
    var byDate = item.byDate.slice(startIdx);

    var adjByDate = {};
    adjustments.forEach(function(a) {
      if (a.media !== item.media || a.product !== item.product) return;
      if (!adjByDate[a.date]) adjByDate[a.date] = [];
      adjByDate[a.date].push(a);
    });

    var dt = new google.visualization.DataTable();
    dt.addColumn('string', '날짜');
    dt.addColumn('number', 'CPA');
    dt.addColumn({ type: 'string', role: 'annotation' });
    dt.addColumn({ type: 'string', role: 'annotationText' });

    days.forEach(function(d, idx) {
      var entry = byDate[idx];
      var cpa = entry && entry.db > 0 ? Math.round(entry.cost / entry.db) : 0;
      var adjs = adjByDate[d];
      var mark = adjs ? (adjs.length > 1 ? (adjs.length + '건') : adjs[0].category) : null;
      var detail = adjs ? adjs.map(function(a) {
        return a.time + ' ' + a.category + (a.detail ? ('(' + a.detail + ')') : '');
      }).join('\n') : null;

      dt.addRow([d.slice(5), cpa, mark, detail]);
    });

    new google.visualization.LineChart(container).draw(dt, {
      legend: { position: 'none' },
      chartArea: { left: 45, top: 10, right: 10, bottom: 30 },
      colors: [SINGLE_SERIES_COLORS.cpa],
      pointSize: 4,
      lineWidth: 2,
      curveType: 'function',
      annotations: { style: 'point' }
    });
  }

  // 전/후 CPA·DB 변화를 근거로 짧은 자동 코멘트를 만든다. 실제 LLM 호출 없이, 이미 계산해둔
  // 숫자들끼리의 상관관계(볼륨과 효율이 같이 좋아졌는지/한쪽만 좋아졌는지/둘 다 나빠졌는지)만
  // 규칙 기반으로 판단한다. before/after의 db가 0이면(조정 전이나 후 데이터 자체가 없으면)
  // 판단 근거가 없다고 본다.
  function buildAdjustmentComment(category, before, after, targetCPA) {
    if (!(before.cpa > 0 && after.cpa > 0)) {
      return { text: '전/후 데이터가 부족해 판단할 수 없습니다.', level: 'neutral' };
    }

    var cpaPct = Math.round((after.cpa - before.cpa) / before.cpa * 100);
    var dbPct = before.db > 0 ? Math.round((after.db - before.db) / before.db * 100) : null;
    var dbText = dbPct === null ? '' : (', DB ' + (dbPct >= 0 ? '+' : '') + dbPct + '%');

    var cpaImproved = cpaPct <= -5;
    var cpaWorsened = cpaPct >= 5;
    var dbGrew = dbPct !== null && dbPct >= 5;
    var dbShrank = dbPct !== null && dbPct <= -5;

    var text, level;

    if (!cpaImproved && !cpaWorsened) {
      text = '[' + category + '] CPA 변화 ' + cpaPct + '%' + dbText + ' — 조정 효과가 뚜렷하지 않습니다. 지속 관찰이 필요합니다.';
      level = 'neutral';
    } else if (cpaImproved && !dbShrank) {
      text = '[' + category + '] CPA ' + cpaPct + '%' + dbText + ' — 효율이 개선됐고 볼륨도 유지·증가했습니다.';
      level = 'good';
    } else if (cpaImproved && dbShrank) {
      text = '[' + category + '] CPA ' + cpaPct + '%' + dbText + ' — CPA는 낮아졌지만 DB도 함께 줄어, 물량 축소에 따른 착시일 수 있습니다.';
      level = 'warn';
    } else if (cpaWorsened && dbGrew) {
      text = '[' + category + '] CPA ' + cpaPct + '%' + dbText + ' — 볼륨은 늘었지만 비용 부담도 커졌습니다. 확인이 필요합니다.';
      level = 'warn';
    } else {
      text = '[' + category + '] CPA ' + cpaPct + '%' + dbText + ' — 효율이 악화됐습니다. 재검토를 권장합니다.';
      level = 'bad';
    }

    if (targetCPA > 0) {
      if (after.cpa <= targetCPA && before.cpa > targetCPA) {
        text += ' 목표 CPA 이내로 진입했습니다.';
      } else if (after.cpa > targetCPA) {
        text += ' 목표 CPA(' + targetCPA.toLocaleString() + ') 초과 상태입니다.';
      }
    }

    return { text: text, level: level };
  }

  // 조정 건마다 자기 자신의 매체/보종 실적으로 전/후를 계산한다(현재 필터가 여러 항목을
  // 합쳐 보고 있어도, 표의 각 행은 항상 그 조정이 실제로 일어난 항목 기준으로 계산됨).
  function renderAdjustTable(adjustments, windowDays) {
    var body = document.getElementById('adjustTableBody');
    body.innerHTML = '';

    if (adjustments.length === 0) {
      body.innerHTML = '<tr><td colspan="13" class="empty">표시할 조정사항이 없습니다.</td></tr>';
      return;
    }

    var rows = adjustments.map(function(a) {
      var result = computeMergedBeforeAfter(a, windowDays);
      var item = findItemByMediaProduct(a.media, a.product);
      return {
        adj: a,
        before: result.before,
        after: result.after,
        intradayOk: result.intradayOk,
        targetCPA: item ? item.targetCPA : 0
      };
    });

    rows.sort(function(a, b) { return a.adj.date < b.adj.date ? 1 : (a.adj.date > b.adj.date ? -1 : 0); });

    rows.forEach(function(r) {
      var tr = document.createElement('tr');
      var cpaDiff = (r.before.cpa > 0 && r.after.cpa > 0)
        ? (Math.round((r.after.cpa - r.before.cpa) / r.before.cpa * 100) + '%')
        : '-';
      var note = r.intradayOk ? '' : ' <span class="adjust-hint">(당일 데이터 부족, D일 제외)</span>';
      var comment = buildAdjustmentComment(r.adj.category, r.before, r.after, r.targetCPA);
      var commentClass = { good: 'comment-good', warn: 'comment-warn', bad: 'comment-bad', neutral: 'comment-neutral' }[comment.level];
      var badge = '<div class="ai-comment ' + commentClass + '">' + comment.text + '</div>';

      tr.innerHTML =
        '<td>' + r.adj.date + ' ' + r.adj.time + '</td>' +
        '<td>' + r.adj.media + '</td>' +
        '<td>' + r.adj.product + '</td>' +
        '<td>' + r.adj.category + '</td>' +
        '<td>' + (r.adj.detail || '-') + note + '</td>' +
        '<td>' + fmtOrDash(r.before.cost) + '</td>' +
        '<td>' + fmtOrDash(r.before.db) + '</td>' +
        '<td>' + fmtOrDash(r.before.cpa) + '</td>' +
        '<td>' + fmtOrDash(r.after.cost) + '</td>' +
        '<td>' + fmtOrDash(r.after.db) + '</td>' +
        '<td>' + fmtOrDash(r.after.cpa) + '</td>' +
        '<td>' + cpaDiff + '</td>' +
        '<td style="text-align:left;white-space:normal;">' + badge + '</td>';
      body.appendChild(tr);
    });
  }

  // 매체||보종||날짜 조합별로 조정 건을 묶어 "조정 건 선택" 드롭다운을 채운다. 이전에 고른
  // 값이 여전히 유효하면 그대로 유지하고, 아니면 가장 최근 날짜를 기본 선택한다.
  function populateIntradayDateSelect(adjustments) {
    var select = document.getElementById('intradayDateSelect');
    var prevValue = select.value;

    var groups = {};
    adjustments.forEach(function(a) {
      var key = a.media + '||' + a.product + '||' + a.date;
      if (!groups[key]) groups[key] = { media: a.media, product: a.product, date: a.date, items: [] };
      groups[key].items.push(a);
    });

    var keys = Object.keys(groups).sort(function(x, y) {
      return groups[x].date < groups[y].date ? 1 : (groups[x].date > groups[y].date ? -1 : 0);
    });

    select.innerHTML = '';

    if (keys.length === 0) {
      select.innerHTML = '<option value="">표시할 조정사항이 없습니다</option>';
      return;
    }

    keys.forEach(function(key) {
      var g = groups[key];
      var opt = document.createElement('option');
      opt.value = key;
      opt.textContent = g.date + ' · ' + g.media + '/' + g.product +
        (g.items.length > 1 ? (' (' + g.items.length + '건)') : (' · ' + g.items[0].category));
      select.appendChild(opt);
    });

    select.value = groups[prevValue] ? prevValue : keys[0];
  }

  function renderIntradayChart(snaps, adjsOnDate) {
    var container = document.getElementById('intradayChart');

    if (snaps.length === 0) {
      container.innerHTML = '';
      return;
    }

    var dt = new google.visualization.DataTable();
    dt.addColumn('string', '시각');
    dt.addColumn('number', 'CPA');
    dt.addColumn({ type: 'string', role: 'annotation' });
    dt.addColumn({ type: 'string', role: 'annotationText' });

    snaps.forEach(function(s) {
      var cpa = s.db > 0 ? Math.round(s.cost / s.db) : 0;
      var label = s.time === '00:00' ? '[최종마감]' : s.time;

      var marks = adjsOnDate.filter(function(a) { return markerSnapshotTime(snaps, a.time) === s.time; });
      var mark = marks.length ? (marks.length > 1 ? (marks.length + '건') : marks[0].category) : null;
      var detail = marks.length ? marks.map(function(a) {
        var beforeFirst = !baselineSnapshotTime(snaps, a.time);
        return a.time + ' ' + a.category + (a.detail ? ('(' + a.detail + ')') : '') +
          (beforeFirst ? ' (이 시점 이전 조정, 그 날 첫 스냅샷에 표시)' : '');
      }).join('\n') : null;

      dt.addRow([label, cpa, mark, detail]);
    });

    new google.visualization.LineChart(container).draw(dt, {
      legend: { position: 'none' },
      chartArea: { left: 45, top: 10, right: 10, bottom: 30 },
      colors: [SINGLE_SERIES_COLORS.cpa],
      pointSize: 4,
      lineWidth: 2,
      curveType: 'function',
      annotations: { style: 'point' }
    });
  }

  function renderIntradayTable(snaps, adjsOnDate) {
    var body = document.getElementById('intradayTableBody');
    body.innerHTML = '';

    if (snaps.length === 0) {
      body.innerHTML = '<tr><td colspan="5" class="empty">그 날의 시간대별 스냅샷이 없습니다.</td></tr>';
      return;
    }

    var byMarker = {};
    adjsOnDate.forEach(function(a) {
      var t = markerSnapshotTime(snaps, a.time);
      if (!t) return;
      if (!byMarker[t]) byMarker[t] = [];
      byMarker[t].push(a);
    });

    snaps.forEach(function(s) {
      var tr = document.createElement('tr');
      var label = s.time === '00:00' ? '[최종마감]' : s.time;
      var cpa = s.db > 0 ? Math.round(s.cost / s.db) : 0;
      var marks = byMarker[s.time];
      var markCell = marks
        ? marks.map(function(a) {
            var beforeFirst = !baselineSnapshotTime(snaps, a.time);
            return '◀ ' + a.time + ' ' + a.category + (a.detail ? ('(' + a.detail + ')') : '') +
              (beforeFirst ? ' (이 시점 이전 조정)' : '');
          }).join('<br>')
        : '';

      tr.innerHTML =
        '<td>' + label + '</td>' +
        '<td>' + fmtOrDash(s.cost) + '</td>' +
        '<td>' + fmtOrDash(s.db) + '</td>' +
        '<td>' + fmtOrDash(cpa) + '</td>' +
        '<td style="text-align:left;color:#c5221f;">' + markCell + '</td>';
      body.appendChild(tr);
    });
  }

  function renderIntraday(adjustments) {
    populateIntradayDateSelect(adjustments);

    var select = document.getElementById('intradayDateSelect');
    var key = select.value;

    if (!key) {
      renderIntradayChart([], []);
      renderIntradayTable([], []);
      return;
    }

    var parts = key.split('||');
    var media = parts[0], product = parts[1], date = parts[2];

    var snaps = getDaySnapshots(media, product, date);
    var adjsOnDate = adjustments.filter(function(a) {
      return a.media === media && a.product === product && a.date === date;
    });

    renderIntradayChart(snaps, adjsOnDate);
    renderIntradayTable(snaps, adjsOnDate);
  }

  var compareWindowInput = document.getElementById('compareWindow');
  compareWindowInput.value = DATA.defaultCompareWindow || 3;

  function refreshAdjustTab() {
    var matchedItems = getMatchedItems();
    var adjustments = getMatchedAdjustments();
    var windowDays = parseInt(compareWindowInput.value, 10) || 3;
    var singleItem = matchedItems.length === 1;

    document.getElementById('adjustHint').textContent = singleItem
      ? ''
      : '매체와 보종을 각각 하나씩 선택하면 조정사항 마커 차트가 표시됩니다.';

    renderAdjustChart(singleItem ? matchedItems[0] : null, adjustments);
    renderAdjustTable(adjustments, windowDays);
    renderIntraday(adjustments);
  }

  document.querySelectorAll('.subtab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.subtab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');

      var sub = btn.dataset.subtab;
      document.getElementById('subtab-daily').style.display = sub === 'daily' ? '' : 'none';
      document.getElementById('subtab-intraday').style.display = sub === 'intraday' ? '' : 'none';

      // 숨겨진 동안 그린 차트는 크기가 0이라 깨질 수 있으므로, 보이는 순간 다시 그린다.
      if (sub === 'intraday') renderIntraday(getMatchedAdjustments());
      else refreshAdjustTab();
    });
  });

  document.getElementById('intradayDateSelect').addEventListener('change', function() {
    renderIntraday(getMatchedAdjustments());
  });

  var currentTab = 'trend';

  var chartsReady = false;

  function refreshIfReady() {
    if (!chartsReady) return;
    if (currentTab === 'adjust') refreshAdjustTab(); else refresh();
  }

  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');

      currentTab = btn.dataset.tab;
      document.getElementById('tab-trend').style.display = currentTab === 'trend' ? '' : 'none';
      document.getElementById('tab-adjust').style.display = currentTab === 'adjust' ? '' : 'none';

      refreshIfReady();
    });
  });

  compareWindowInput.addEventListener('input', refreshIfReady);
  compareWindowInput.addEventListener('change', refreshIfReady);

  mediaMultiSelect.onChange(function() {
    rebuildProductOptions();
    refreshIfReady();
  });
  productMultiSelect.onChange(refreshIfReady);
  daysInput.addEventListener('input', refreshIfReady);
  daysInput.addEventListener('change', refreshIfReady);
  sortOrder.addEventListener('change', refreshIfReady);

  rebuildProductOptions();
  google.charts.load('current', { packages: ['corechart'] });
  google.charts.setOnLoadCallback(function() {
    chartsReady = true;
    refreshIfReady();
  });
</script>
</body>
</html>
