<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<script src="https://www.gstatic.com/charts/loader.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
    margin: 0;
    padding: 16px 20px;
    color: #202124;
    font-size: 13px;
  }
  h2 {
    font-size: 15px;
    margin: 0 0 12px;
    color: #3c4043;
  }
  .filters {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
  }
  .filters label {
    font-size: 12px;
    color: #5f6368;
    margin-right: 4px;
  }
  select {
    padding: 5px 8px;
    border: 1px solid #dadce0;
    border-radius: 6px;
    font-size: 13px;
    background: #fff;
  }
  .charts {
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
  }
  .chart-box {
    flex: 1;
    border: 1px solid #e8eaed;
    border-radius: 8px;
    padding: 8px;
  }
  .chart-box .chart-title {
    font-size: 12px;
    color: #5f6368;
    margin: 2px 0 4px 4px;
  }
  .chart {
    width: 100%;
    height: 200px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  thead th, tbody td {
    border: 1px solid #dadce0;
  }
  thead th {
    text-align: right;
    padding: 6px 10px;
    color: #5f6368;
    font-weight: 600;
    position: sticky;
    top: 0;
    background: #fff;
  }
  thead th:first-child { text-align: left; }
  tbody td {
    text-align: right;
    padding: 5px 10px;
  }
  tbody td:first-child { text-align: left; color: #3c4043; }
  tbody tr:hover { background: #f8f9fa; }
  .table-wrap {
    max-height: 320px;
    overflow-y: auto;
    border: 1px solid #e8eaed;
    border-radius: 8px;
  }
  .status {
    display: inline-block;
    margin-left: 6px;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 10px;
  }
  .status-good { color: #1e8e3e; background: #e6f4ea; }
  .status-warn { color: #b06000; background: #fef7e0; }
  .status-bad { color: #c5221f; background: #fce8e6; }
  .empty { color: #80868b; padding: 12px 4px; }
</style>
</head>
<body>
  <h2>최종마감 추이</h2>

  <div class="filters">
    <label for="daysInput">최근 일수</label>
    <input type="number" id="daysInput" min="1" value="14" style="width:60px;">
    <label for="mediaSelect">매체</label>
    <select id="mediaSelect"></select>
    <label for="productSelect">보종</label>
    <select id="productSelect"></select>
  </div>

  <div class="charts">
    <div class="chart-box">
      <div class="chart-title">비용 추이</div>
      <div id="costChart" class="chart"></div>
    </div>
    <div class="chart-box">
      <div class="chart-title">DB 추이</div>
      <div id="dbChart" class="chart"></div>
    </div>
    <div class="chart-box">
      <div class="chart-title">단가(CPA) 추이</div>
      <div id="cpaChart" class="chart"></div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>날짜</th>
          <th>비용</th>
          <th>DB</th>
          <th>단가</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

<script>
  var DATA = <?!= dataJson ?>;
  var ALL = "__ALL__";

  var daysInput = document.getElementById('daysInput');
  daysInput.max = DATA.days.length;
  daysInput.value = Math.min(DATA.defaultDays || 14, DATA.days.length);

  var mediaSelect = document.getElementById('mediaSelect');
  var productSelect = document.getElementById('productSelect');

  var allOption = document.createElement('option');
  allOption.value = ALL;
  allOption.textContent = "전체";
  mediaSelect.appendChild(allOption);

  DATA.mediaGroups.forEach(function(g) {
    var opt = document.createElement('option');
    opt.value = g.media;
    opt.textContent = g.media;
    mediaSelect.appendChild(opt);
  });

  function findMediaGroup(media) {
    for (var i = 0; i < DATA.mediaGroups.length; i++) {
      if (DATA.mediaGroups[i].media === media) return DATA.mediaGroups[i];
    }
    return null;
  }

  // 매체와 무관하게, 전체 매체를 통틀어 등장하는 보종 이름 목록(중복 제거)을 구한다.
  function collectAllProducts() {
    var seen = {};
    var list = [];
    DATA.mediaGroups.forEach(function(g) {
      g.items.forEach(function(item) {
        if (!seen[item.product]) {
          seen[item.product] = true;
          list.push(item.product);
        }
      });
    });
    return list;
  }

  // 매체를 "전체"로 두더라도 보종만 골라 매체 간 합산해서 볼 수 있도록, 보종 선택창은
  // 매체 선택 여부와 상관없이 항상 활성화해둔다.
  function rebuildProductOptions() {
    productSelect.innerHTML = '';
    var allOpt = document.createElement('option');
    allOpt.value = ALL;
    allOpt.textContent = "전체";
    productSelect.appendChild(allOpt);

    var products;
    if (mediaSelect.value === ALL) {
      products = collectAllProducts();
    } else {
      var group = findMediaGroup(mediaSelect.value);
      products = group ? group.items.map(function(item) { return item.product; }) : [];
    }

    products.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p;
      opt.textContent = p;
      productSelect.appendChild(opt);
    });
  }

  // 입력창에 지정한 최근 일수만큼(전체 중 뒤쪽 N일) 잘라서 사용할 시작 인덱스를 구한다.
  function getVisibleStartIndex() {
    var n = parseInt(daysInput.value, 10);
    if (!n || n < 1) n = 1;
    if (n > DATA.days.length) n = DATA.days.length;
    return DATA.days.length - n;
  }

  // 선택 조건(매체/보종, 최근 일수)에 맞는 날짜별 {cost, db} 합계 배열과, 매칭된 항목이
  // 정확히 하나일 때의 targetCPA(그 외에는 null)를 계산한다. 매체가 "전체"여도 보종만
  // 선택하면 그 보종을 매체 전체에서 합산해서 보여준다.
  function computeSeries() {
    var startIdx = getVisibleStartIndex();
    var days = DATA.days.slice(startIdx);
    var totals = days.map(function() { return { cost: 0, db: 0 }; });

    var mediaValue = mediaSelect.value;
    var productValue = productSelect.value;

    var groups = mediaValue === ALL ? DATA.mediaGroups : [findMediaGroup(mediaValue)].filter(Boolean);

    var matchedItems = [];
    groups.forEach(function(group) {
      group.items.forEach(function(item) {
        if (productValue !== ALL && item.product !== productValue) return;
        matchedItems.push(item);
      });
    });

    matchedItems.forEach(function(item) {
      item.byDate.slice(startIdx).forEach(function(entry, idx) {
        if (!entry) return;
        totals[idx].cost += entry.cost;
        totals[idx].db += entry.db;
      });
    });

    var targetCPA = matchedItems.length === 1 ? matchedItems[0].targetCPA : null;

    return days.map(function(d, idx) {
      var cost = totals[idx].cost;
      var db = totals[idx].db;
      return {
        date: d,
        cost: cost,
        db: db,
        cpa: db > 0 ? Math.round(cost / db) : 0,
        hasData: cost > 0 || db > 0
      };
    }).map(function(row) { row.targetCPA = targetCPA; return row; });
  }

  function statusBadge(row) {
    if (row.targetCPA === null || row.targetCPA === undefined || !row.hasData) return '';
    if (row.cpa <= row.targetCPA) return '<span class="status status-good">적정</span>';
    if (row.cpa <= row.targetCPA * 1.2) return '<span class="status status-warn">주의</span>';
    return '<span class="status status-bad">초과</span>';
  }

  function renderTable(rows) {
    var body = document.getElementById('tableBody');
    body.innerHTML = '';

    rows.forEach(function(row) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + row.date + '</td>' +
        '<td>' + (row.hasData ? row.cost.toLocaleString() : '-') + '</td>' +
        '<td>' + (row.hasData ? row.db.toLocaleString() : '-') + '</td>' +
        '<td>' + (row.hasData ? row.cpa.toLocaleString() : '-') + statusBadge(row) + '</td>';
      body.appendChild(tr);
    });
  }

  function drawCharts(rows) {
    var costData = new google.visualization.DataTable();
    costData.addColumn('string', '날짜');
    costData.addColumn('number', '비용');

    var dbData = new google.visualization.DataTable();
    dbData.addColumn('string', '날짜');
    dbData.addColumn('number', 'DB');

    var cpaData = new google.visualization.DataTable();
    cpaData.addColumn('string', '날짜');
    cpaData.addColumn('number', '단가');

    rows.forEach(function(row) {
      costData.addRow([row.date.slice(5), row.cost]);
      dbData.addRow([row.date.slice(5), row.db]);
      cpaData.addRow([row.date.slice(5), row.cpa]);
    });

    var baseOptions = {
      legend: { position: 'none' },
      chartArea: { left: 45, top: 10, right: 10, bottom: 30 },
      colors: ['#4285f4'],
      pointSize: 4,
      lineWidth: 2,
      curveType: 'function' // 완만한 곡선
    };

    new google.visualization.LineChart(document.getElementById('costChart'))
      .draw(costData, Object.assign({}, baseOptions, { colors: ['#4285f4'] }));
    new google.visualization.LineChart(document.getElementById('dbChart'))
      .draw(dbData, Object.assign({}, baseOptions, { colors: ['#0f9d58'] }));
    new google.visualization.LineChart(document.getElementById('cpaChart'))
      .draw(cpaData, Object.assign({}, baseOptions, { colors: ['#db4437'] }));
  }

  function refresh() {
    var rows = computeSeries();
    if (rows.every(function(r) { return !r.hasData; })) {
      document.getElementById('tableBody').innerHTML =
        '<tr><td colspan="4" class="empty">표시할 최종마감 데이터가 없습니다.</td></tr>';
    } else {
      renderTable(rows);
    }
    drawCharts(rows);
  }

  var chartsReady = false;

  function refreshIfReady() {
    if (chartsReady) refresh();
  }

  mediaSelect.addEventListener('change', function() {
    rebuildProductOptions();
    refreshIfReady();
  });
  productSelect.addEventListener('change', refreshIfReady);
  daysInput.addEventListener('input', refreshIfReady);
  daysInput.addEventListener('change', refreshIfReady);

  rebuildProductOptions();
  google.charts.load('current', { packages: ['corechart'] });
  google.charts.setOnLoadCallback(function() {
    chartsReady = true;
    refresh();
  });
</script>
</body>
</html>
